<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2430"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb24d"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
  </defs>

  <!-- rounded background (same style as the KTR app icon) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 2x2 grid of cells: K W / A D -->
  <g fill="url(#acc)" fill-opacity="0.15" stroke="url(#acc)" stroke-opacity="0.85" stroke-width="4">
    <rect x="96" y="96" width="150" height="150" rx="30"/>
    <rect x="266" y="96" width="150" height="150" rx="30"/>
    <rect x="96" y="266" width="150" height="150" rx="30"/>
    <rect x="266" y="266" width="150" height="150" rx="30"/>
  </g>

  <!-- the four letters, read left-to-right / top-to-bottom -->
  <g fill="url(#acc)" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="120" text-anchor="middle">
    <text x="171" y="212">K</text>
    <text x="341" y="212">W</text>
    <text x="171" y="382">A</text>
    <text x="341" y="382">D</text>
  </g>
</svg>
