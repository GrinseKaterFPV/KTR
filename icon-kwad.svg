<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2430"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb24d"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
  </defs>

  <!-- rounded background (same as the KTR app icon) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- FPV freestyle quad: four arms out to the motors -->
  <g stroke="url(#acc)" stroke-width="20" stroke-linecap="round">
    <line x1="238" y1="238" x2="152" y2="152"/>
    <line x1="274" y1="238" x2="360" y2="152"/>
    <line x1="238" y1="274" x2="152" y2="360"/>
    <line x1="274" y1="274" x2="360" y2="360"/>
  </g>

  <!-- spinnging propellers (two crossed blades each), translucent accent like the grid -->
  <g fill="url(#acc)" fill-opacity="0.16" stroke="url(#acc)" stroke-opacity="0.85" stroke-width="4">
    <g transform="translate(152 152) rotate(45)">
      <ellipse rx="62" ry="13"/>
      <ellipse rx="62" ry="13" transform="rotate(90)"/>
    </g>
    <g transform="translate(360 152) rotate(-45)">
      <ellipse rx="62" ry="13"/>
      <ellipse rx="62" ry="13" transform="rotate(90)"/>
    </g>
    <g transform="translate(152 360) rotate(-45)">
      <ellipse rx="62" ry="13"/>
      <ellipse rx="62" ry="13" transform="rotate(90)"/>
    </g>
    <g transform="translate(360 360) rotate(45)">
      <ellipse rx="62" ry="13"/>
      <ellipse rx="62" ry="13" transform="rotate(90)"/>
    </g>
  </g>

  <!-- motor bells -->
  <g fill="url(#acc)">
    <circle cx="152" cy="152" r="15"/>
    <circle cx="360" cy="152" r="15"/>
    <circle cx="152" cy="360" r="15"/>
    <circle cx="360" cy="360" r="15"/>
  </g>

  <!-- central body / canopy -->
  <rect x="212" y="212" width="88" height="88" rx="24" fill="url(#acc)"/>
  <!-- camera pod / lens -->
  <circle cx="256" cy="256" r="20" fill="#0b0f14"/>
  <circle cx="256" cy="256" r="9" fill="url(#acc)"/>
</svg>
