<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2430"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb24d"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
  </defs>

  <!-- rounded background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 3x3 grid: outer cells -->
  <g fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.11" stroke-width="3">
    <rect x="116" y="116" width="84" height="84" rx="16"/>
    <rect x="116" y="214" width="84" height="84" rx="16"/>
    <rect x="116" y="312" width="84" height="84" rx="16"/>
    <rect x="312" y="116" width="84" height="84" rx="16"/>
    <rect x="312" y="214" width="84" height="84" rx="16"/>
    <rect x="312" y="312" width="84" height="84" rx="16"/>
  </g>

  <!-- dots in the outer cells -->
  <g fill="url(#acc)" fill-opacity="0.55">
    <circle cx="158" cy="158" r="7"/>
    <circle cx="158" cy="256" r="7"/>
    <circle cx="158" cy="354" r="7"/>
    <circle cx="354" cy="158" r="7"/>
    <circle cx="354" cy="256" r="7"/>
    <circle cx="354" cy="354" r="7"/>
  </g>

  <!-- middle column: the three letters stacked K / T / R -->
  <g fill="url(#acc)" fill-opacity="0.16" stroke="url(#acc)" stroke-width="4">
    <rect x="214" y="116" width="84" height="84" rx="16"/>
    <rect x="214" y="214" width="84" height="84" rx="16"/>
    <rect x="214" y="312" width="84" height="84" rx="16"/>
  </g>
  <g fill="url(#acc)" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="76" text-anchor="middle">
    <text x="256" y="184">K</text>
    <text x="256" y="282">T</text>
    <text x="256" y="380">R</text>
  </g>
</svg>
