<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2430"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb24d"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
  </defs>

  <!-- rounded background (same style as the KTR app icon) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- stopwatch: crown + stem -->
  <rect x="226" y="86" width="60" height="34" rx="14" fill="url(#acc)"/>
  <rect x="240" y="112" width="32" height="52" rx="12" fill="url(#acc)"/>

  <!-- stopwatch: dial -->
  <circle cx="256" cy="294" r="130" fill="none" stroke="url(#acc)" stroke-width="26"/>

  <!-- hands -->
  <line x1="256" y1="294" x2="256" y2="212" stroke="url(#acc)" stroke-width="24" stroke-linecap="round"/>
  <line x1="256" y1="294" x2="322" y2="294" stroke="url(#acc)" stroke-width="24" stroke-linecap="round"/>
  <circle cx="256" cy="294" r="16" fill="url(#acc)"/>
</svg>
