<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2430"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb24d"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
  </defs>

  <!-- rounded background (same style as the KTR app icon) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- pilot profile: head -->
  <circle cx="256" cy="196" r="68" fill="url(#acc)"/>

  <!-- pilot profile: shoulders -->
  <path d="M116 408 a140 140 0 0 1 280 0 z" fill="url(#acc)"/>
</svg>
