<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2430"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb24d"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
  </defs>

  <!-- rounded background (same style as the KTR app icon) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- gear teeth (8x, rotated around the centre) -->
  <g fill="url(#acc)">
    <rect x="236" y="88" width="40" height="72" rx="12"/>
    <rect x="236" y="88" width="40" height="72" rx="12" transform="rotate(45 256 256)"/>
    <rect x="236" y="88" width="40" height="72" rx="12" transform="rotate(90 256 256)"/>
    <rect x="236" y="88" width="40" height="72" rx="12" transform="rotate(135 256 256)"/>
    <rect x="236" y="88" width="40" height="72" rx="12" transform="rotate(180 256 256)"/>
    <rect x="236" y="88" width="40" height="72" rx="12" transform="rotate(225 256 256)"/>
    <rect x="236" y="88" width="40" height="72" rx="12" transform="rotate(270 256 256)"/>
    <rect x="236" y="88" width="40" height="72" rx="12" transform="rotate(315 256 256)"/>
  </g>

  <!-- gear body -->
  <circle cx="256" cy="256" r="132" fill="url(#acc)"/>

  <!-- gear hole -->
  <circle cx="256" cy="256" r="54" fill="#0b0f14"/>
</svg>
